# PockAI layout for tiny-dfr (Linux on Touch Bar Macs)
# Installed by `pockai-touchbar apply pockai` to /etc/tiny-dfr/config.toml.
# Media + clock + battery by default; hold Fn for F1–F12. Esc is added automatically.

MediaLayerDefault = true
ShowButtonOutlines = true
EnablePixelShift = false
FontTemplate = ":bold"
AdaptiveBrightness = true
ActiveBrightness = 128
DoublePressSwitchLayers = 0

PrimaryLayerKeys = [
    { Text = "F1",  Action = "F1"  },
    { Text = "F2",  Action = "F2"  },
    { Text = "F3",  Action = "F3"  },
    { Text = "F4",  Action = "F4"  },
    { Text = "F5",  Action = "F5"  },
    { Text = "F6",  Action = "F6"  },
    { Text = "F7",  Action = "F7"  },
    { Text = "F8",  Action = "F8"  },
    { Text = "F9",  Action = "F9"  },
    { Text = "F10", Action = "F10" },
    { Text = "F11", Action = "F11" },
    { Text = "F12", Action = "F12" }
]

MediaLayerKeys = [
    { Icon = "brightness_low",  Action = "BrightnessDown" },
    { Icon = "brightness_high", Action = "BrightnessUp"   },
    { Icon = "backlight_low",   Action = "IllumDown"      },
    { Icon = "backlight_high",  Action = "IllumUp"        },
    { Time = "%H:%M", Action = "Time", Stretch = 2 },
    { Battery = "both", Action = "Battery", Stretch = 2 },
    { Icon = "fast_rewind",     Action = "PreviousSong"   },
    { Icon = "play_pause",      Action = "PlayPause"      },
    { Icon = "fast_forward",    Action = "NextSong"       },
    { Icon = "volume_off",      Action = "Mute"           },
    { Icon = "volume_down",     Action = "VolumeDown"     },
    { Icon = "volume_up",       Action = "VolumeUp"       }
]
